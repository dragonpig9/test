# Render Blueprint: CommonHours API (Node) + managed PostgreSQL.
# New → Blueprint → select this repo. Then set WEB_ORIGIN to your Cloudflare Pages URL.
databases:
  - name: commonhours-db
    plan: free
    databaseName: commonhours
    user: commonhours

services:
  - type: web
    name: commonhours-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npx prisma generate --schema apps/api/prisma/schema.prisma
    startCommand: npm run start:prod -w @commonhours/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: commonhours-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: WEB_ORIGIN
        value: https://commonhours.pages.dev
      # Public hackathon demo: enables the account switcher, simulated clock and reset button for everyone.
      - key: DEMO_MODE
        value: "true"
      - key: DEBUG_ENDPOINTS
        value: "false"
